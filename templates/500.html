{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Error | College Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex align-items-center min-vh-100">
    {# Kept standalone so it renders even when the base layout or database is the cause of the error #}
    <div class="container error-page text-center">
        <div class="error-code">500</div>
        <h1 class="h3 mb-3">Something went wrong</h1>
        <p class="text-muted mb-4">An unexpected error occurred. Please try again in a few moments.</p>
        <a href="/" class="btn btn-primary-cms">Back to Home</a>
    </div>
</body>
</html>
