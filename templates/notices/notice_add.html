{% extends "base.html" %}
{% block title %}Post Notice{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{% url 'notices:list' %}" class="small"><i class="bi bi-arrow-left"></i> Back to notices</a>
        {% include "includes/page_header.html" with title="Post a Notice" icon="megaphone" %}
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" novalidate class="needs-validation">
                    {% csrf_token %}
                    {% include "includes/form.html" with form=form %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-cms"><i class="bi bi-send"></i> Publish</button>
                        <a href="{% url 'notices:list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
